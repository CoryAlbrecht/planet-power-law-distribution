name: Unstable Release Tracker
on:
  push:
    branches:
      - 'version-*'
      # Exclude version-0.1.0 since it is now stable
      - '!version-0.1.0'

jobs:
  update-unstable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME#version-}" >> $GITHUB_OUTPUT

      - name: Update Unstable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.VERSION }}-unstable
          name: "v${{ steps.vars.outputs.VERSION }} (Unstable Build)"
          body: |
            ### Automated Unstable Build
            Tracking latest changes in `${{ github.ref_name }}`.
            **Last push:** ${{ github.event.head_commit.timestamp }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
